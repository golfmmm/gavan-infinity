name: Build Gavan Infinity jar

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Forge MDK 1.20.1
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Put the mod into the MDK
        run: |
          rm -rf mdk/src/main/java/com/example mdk/src/main/resources mdk/src/generated
          cp -r src mdk/
          cp gradle.properties mdk/gradle.properties

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: gavaninfinity-1.0.0
          path: mdk/build/libs/gavaninfinity-1.0.0.jar
